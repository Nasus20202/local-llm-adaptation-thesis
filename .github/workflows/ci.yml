name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --locked

      - name: Check lock consistency
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run coverage run -m pytest -q

      - name: Report coverage
        run: uv run coverage report

      - name: Build package
        run: uv build

      - name: Validate committed example
        run: uv run thesis-bench validate-config examples/foundation/experiment.yaml

      - name: Validate Renovate configuration
        run: npx --yes --package renovate renovate-config-validator renovate.json

      - name: Validate OpenSpec change
        run: npx --yes @fission-ai/openspec validate foundation-experiment-platform --strict --no-interactive
