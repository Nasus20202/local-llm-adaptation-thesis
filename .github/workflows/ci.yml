name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up repository Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version

      - name: Set up repository Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: pyproject.toml
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --locked

      - name: Check lock consistency
        run: uv lock --check

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type-check
        run: uv run mypy src

      - name: Test with coverage
        run: uv run coverage run -m pytest -q

      - name: Report coverage
        run: uv run coverage report

      - name: Build package
        run: uv build

      - name: Validate committed example
        run: uv run thesis-bench validate-config examples/foundation/experiment.yaml

      - name: Install locked Node validation tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Renovate configuration
        run: ./node_modules/.bin/renovate-config-validator renovate.json

      - name: Validate OpenSpec artifacts
        run: ./node_modules/.bin/openspec validate --all --strict --no-interactive
