name: Thesis build

on:
  push:
    paths:
      - 'thesis/**'
      - '.github/workflows/thesis-build.yml'
  pull_request:
    paths:
      - 'thesis/**'
      - '.github/workflows/thesis-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check thesis build contract
        run: bash thesis/tests/test_build_contract.sh

      - name: Install TeX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            biber \
            fonts-lmodern \
            latexmk \
            poppler-utils \
            python3-pygments \
            texlive-bibtex-extra \
            texlive-extra-utils \
            texlive-lang-polish \
            texlive-latex-extra \
            texlive-luatex

      - name: Build thesis PDF
        run: |
          set -euo pipefail

          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          cp -a thesis/upstream/weti-2026/. "$build_dir"/
          mkdir -p "$build_dir/inputs"
          cp -a thesis/overlay/. "$build_dir"/
          cp thesis/inputs/title-page.pdf "$build_dir/inputs/title-page.pdf"

          mkdir -p "$GITHUB_WORKSPACE/thesis/build"
          (
            cd "$build_dir"
            latexmk -C
            latexmk -lualatex -shell-escape -interaction=nonstopmode -halt-on-error main.tex
            pdfinfo main.pdf
          )
          cp "$build_dir/main.pdf" "$GITHUB_WORKSPACE/thesis/build/main.pdf"

      - name: Upload thesis PDF
        uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/build/main.pdf
          if-no-files-found: error
          retention-days: 14
