[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thesis-bench"
dynamic = ["version"]
description = "Research-support metadata and provenance tooling for local LLM experiments."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
thesis-bench = "thesis_bench.cli:main"

[dependency-groups]
dev = [
  "coverage>=7.13,<8",
  "mypy>=2.3,<3",
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[tool.hatch.version]
path = "src/thesis_bench/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_bench"]

[tool.uv]
required-version = "==0.10.2"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.coverage.run]
branch = true
source = ["thesis_bench"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "pragma: no cover",
]
